<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coaching Hub - 1Banyuhay Financial Group</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #a85a2b 0%, #9d5220 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-container { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 420px; }
    .login-header { background: linear-gradient(135deg, #a85a2b 0%, #9d5220 100%); color: white; padding: 40px 30px; text-align: center; }
    .login-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .login-form { padding: 40px 30px; }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #2c2c2c; margin-bottom: 8px; text-transform: uppercase; }
    .form-group input { width: 100%; padding: 12px 16px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; }
    .error-message { background: #fee; border-left: 4px solid #c32626; color: #c32626; padding: 12px 16px; border-radius: 4px; margin-bottom: 20px; display: none; }
    .error-message.show { display: block; }
    .login-button { width: 100%; padding: 14px; background: linear-gradient(135deg, #a85a2b 0%, #9d5220 100%); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Coaching Hub</h1>
      <p>Sign in to your account</p>
    </div>
    <div class="login-form">
      <div class="error-message" id="errorMessage"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="e.g., mikko.rodriguez" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="login-button">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vszfhpbvzzxijcrrnclh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzemZocGJ2enp4aWpjcnJuY2xoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzAzMTEsImV4cCI6MjEwMzgwNjMxMX0.p48DdmF9k4nSOdm6Eeag42yZBO1HKZVin2Bhl_MNQ7Q';
    
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Please enter username and password');
        return;
      }

      errorMsg.classList.remove('show');

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/coaching_users?select=id,username,full_name,role,branch,password`,
          {
            headers: {
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'apikey': SUPABASE_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const users = await response.json();
        const user = users.find(u => u.username === username);
        
        if (!user || user.password !== password) {
          showError('Invalid username or password');
          return;
        }

        localStorage.setItem('coachingUser', JSON.stringify(user));
        window.location.href = '/coaching';

      } catch (err) {
        console.error('Error:', err);
        showError('An error occurred. Please try again.');
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }
  </script>
</body>
</html>
